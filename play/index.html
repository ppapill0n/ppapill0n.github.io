<!doctype html>
<html lang="en" data-private-pending>
<head>
  <style>html[data-private-pending] { visibility:hidden; }</style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play — Yonghee Kim</title>
  <link rel="stylesheet" href="../gate/gate.css" />
  <link rel="stylesheet" href="../academic.css?v=20261009-freeplay" />
  <link rel="stylesheet" href="play.css" />
  <script src="play.js?v=20261009-freeplay" type="module"></script>
</head>
<body class="play-page">
  <noscript><style>html[data-private-pending] { visibility:visible; } body > :not(noscript) { display:none; }</style><p>Enable JavaScript to play.</p></noscript>
  <header><a class="mark" href="../personal/" aria-label="Yonghee Kim, personal space">YK<span>.</span></a><div class="language-switch" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><span>/</span><button type="button" data-lang="ko" aria-pressed="false">KO</button></div></header>
  <main id="play-main">
    <a class="back-link" href="../personal/" data-copy="back">← Back to personal</a>
    <section id="selection" aria-labelledby="hub-title">
      <p class="overline" data-copy="eyebrow">A little detour</p>
      <h1 id="hub-title" tabindex="-1" data-copy="title">Pick a game.</h1>
      <p class="hub-intro" data-copy="intro">Seven small ways to take a break. Pick whatever catches your eye.</p>
      <div id="game-list" class="game-list"></div>
    </section>
    <section id="play-stage" aria-labelledby="game-title" hidden>
      <div class="play-toolbar"><a href="./" id="all-games" data-copy="choose">← All games</a><button type="button" id="restart" data-copy="restart">Start again</button></div>
      <h1 id="game-title" tabindex="-1"></h1>
      <p id="game-help" class="game-help"></p>
      <div id="game-area">
        <div id="target-row" class="target-row"><div><span class="label" data-copy="target">Target</span><strong id="target"></strong></div></div>
        <div id="game" lang="en" data-game-input-scope></div>
        <p id="state" class="play-state" role="status" aria-live="polite" aria-atomic="true"></p>
      </div>
    </section>
  </main>
  <footer><span>© <span id="year"></span> Yonghee Kim</span></footer>
</body>
</html>
